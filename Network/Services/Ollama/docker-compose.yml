services:
  ollama-arc:
    # ava-agentone/ollama-intel: community-maintained, iGPU-first (Meteor Lake / Arrow Lake)
    # Replaces intelanalytics/ipex-llm-inference-cpp-xpu which was archived Jan 28, 2026
    # Source: https://github.com/Ava-AgentOne/ollama-intel
    image: ghcr.io/ava-agentone/ollama-intel:latest
    container_name: ollama-arc
    # No custom entrypoint needed — ava-agentone image handles ollama serve internally
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=app://obsidian.md*
      - OLLAMA_DEBUG=1
      # Intel iGPU acceleration flags
      - DEVICE=Arc
      - OLLAMA_INTEL_GPU=true
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      # Unload model after 30 min of inactivity (adjust as needed)
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - /home/netyeti/.ollama:/root/.ollama
      - /home/netyeti/.ssh/id_ed25519_ollama:/root/.ollama/id_ed25519:ro
      - /home/netyeti/.ssh/id_ed25519_ollama.pub:/root/.ollama/id_ed25519.pub:ro
    devices:
      # Pass both DRM nodes explicitly — card0 for display, renderD128 for compute
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "11434:11434"
    restart: unless-stopped
    shm_size: '16gb'
    mem_limit: 32g
