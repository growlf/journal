name: Build & Deploy Quartz (Journal)
on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Build & Deploy Quartz Site to pages'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_build == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Quartz
        uses: konstfish/quartz-build-action@v7
        with:
          source: .
          page_title: "Journal of The NetYeti"
          quartz_icon: .github/quartz/icon.png
          quartz_custom_css: .github/quartz/custom.scss
          quartz_config: .github/quartz/quartz.config.ts
          quartz_layout: .github/quartz/quartz.layout.ts
          quartz_banner: _assets/banner.svg
          quartz_repo: https://github.com/CascadeSTEAM/quartz.git
          quartz_repo_ref: csmods
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    needs: build-and-deploy
    if: failure() # Only runs if the build or deploy failed
    runs-on: ubuntu-latest
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          # IMPORTANT: Ensure the DISCORD_WEBHOOK secret in your 'growlf/journal' repo
          # is set to your personal Discord server's webhook URL.
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          content: "⚠️ **Journal Build Failed!** Check the GitHub Actions logs for details."
          title: "Deployment Error - Journal of The NetYeti"
          color: 0xff0000 # Red
